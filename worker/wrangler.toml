name = "serviceai-api"
main = "src/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]
# Public workers.dev URL is optional: Pages calls this Worker via service binding.
# Avoids the first-deploy prompt to register a workers.dev subdomain in CI.
workers_dev = false

[vars]
FRONTEND_URL = "https://serviceai-app-1zv.pages.dev"
# Google OAuth values are not declared here. Empty [vars] replace Wrangler secrets on deploy.
# Local: worker/.dev.vars. Production: wrangler secret put.

[dev]
ip = "127.0.0.1"
port = 8787

[triggers]
crons = ["*/10 * * * *"]

# IDs omitted so the first deploy on a new account can provision KV automatically.
[[kv_namespaces]]
binding = "DEMO_KV"
