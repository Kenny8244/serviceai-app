# Deploy production on every push to main.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token from the target Cloudflare account
#   CLOUDFLARE_ACCOUNT_ID  — Account ID from the Cloudflare dashboard URL
#
# Token permissions (Workers template + Pages):
#   Account · Workers Scripts — Edit
#   Account · Workers KV Storage — Edit
#   Account · Cloudflare Pages — Edit
#   Account · Account Settings — Read
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Worker + Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: serviceai-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure Pages project exists
        run: |
          status=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")
          if [ "$status" = "200" ]; then
            echo "Pages project ${PAGES_PROJECT} already exists"
          elif [ "$status" = "404" ]; then
            npx --prefix ./worker wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          else
            echo "Unexpected status ${status} checking Pages project:"
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy Pages
        run: npx --prefix ./worker wrangler pages deploy dist --project-name=${PAGES_PROJECT} --branch=main
